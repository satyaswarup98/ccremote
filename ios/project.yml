name: CCRemote
options:
  bundleIdPrefix: com.satya
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CCRemote:
    type: application
    platform: iOS
    sources: [CCRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satya.ccremote
        PRODUCT_NAME: CCRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CCRemote/Info.plist
    info:
      path: CCRemote/Info.plist
      properties:
        CFBundleDisplayName: CC Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: CC Remote connects to the bridge on your Mac to control your Claude Code sessions.
        NSBonjourServices: [_ccremote._tcp]
        # Every connection is TLS pinned to the Mac's own certificate (PinningDelegate). ATS would reject that
        # self-signed certificate on Tailscale addresses (100.64.0.0/10 isn't "local" to iOS), so it's off.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes: [ntfy]
        CFBundleURLTypes:
          - CFBundleURLName: com.satya.ccremote
            CFBundleURLSchemes: [ccremote]
