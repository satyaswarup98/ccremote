name: CCRemote
options:
  bundleIdPrefix: com.satya
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CCRemote:
    type: application
    platform: iOS
    sources: [CCRemote]
    # Stamps each build with a number, commit and time, shown in Settings so you can tell builds apart.
    preBuildScripts:
      - name: Build info
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/CCRemote/Generated/BuildInfo.swift
        script: |
          cd "$SRCROOT"
          mkdir -p CCRemote/Generated
          N=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          H=$(git rev-parse --short HEAD 2>/dev/null || echo download)
          D=$(date '+%-d %b %H:%M')
          printf 'enum BuildInfo {\n    static let number = "%s"\n    static let commit = "%s"\n    static let built = "%s"\n}\n' "$N" "$H" "$D" > "$SRCROOT/CCRemote/Generated/BuildInfo.swift"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.satya.ccremote
        PRODUCT_NAME: CCRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CCRemote/Info.plist
    info:
      path: CCRemote/Info.plist
      properties:
        CFBundleDisplayName: CC Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: CC Remote uses the camera when you choose Take Photo to send a picture to Claude.
        NSLocalNetworkUsageDescription: CC Remote connects to the bridge on your Mac to control your Claude Code sessions.
        NSBonjourServices: [_ccremote._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes: [ntfy]
        CFBundleURLTypes:
          - CFBundleURLName: com.satya.ccremote
            CFBundleURLSchemes: [ccremote]
